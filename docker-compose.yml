# Desarrollo (por defecto): solo la base de datos.
#   docker compose up -d
#
# Aplicación completa (base de datos + API + web en http://localhost:8080):
#   docker compose --profile app up -d --build
# Requiere JWT_SECRET (ver README) en el entorno o en un archivo .env en esta carpeta.

services:
  postgres:
    image: postgres:16-alpine
    container_name: barberflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: barberflow
    ports:
      # Solo accesible desde esta máquina (antes quedaba abierto a toda la red).
      - "127.0.0.1:5432:5432"
    volumes:
      - barberflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barberflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/barberflow?schema=public
      # Sin valor por defecto: si falta, la API se niega a arrancar y lo explica en sus logs.
      JWT_SECRET: ${JWT_SECRET:-}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: 1
      BUSINESS_TZ: ${BUSINESS_TZ:-America/Bogota}
      MASTER_EMAIL: ${MASTER_EMAIL:-}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-}
      MASTER_NAME: ${MASTER_NAME:-Administrador BarberFlow}

  web:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  barberflow_pg_data:
